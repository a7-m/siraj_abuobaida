<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CBA052" />
      <stop offset="100%" stop-color="#E8C678" />
    </linearGradient>
  </defs>

  <!-- Left Icon Area -->
  <g transform="translate(10, 10)">
    <!-- Omani Arch/Lamp handle hint -->
    <path d="M 20 30 Q 20 15 30 15 Q 40 15 40 30" fill="none" stroke="#C43831" stroke-width="2" stroke-linecap="round" />
    
    <!-- Open Book -->
    <path d="M 15 35 Q 25 35 30 40 Q 35 35 45 35 L 43 25 Q 35 25 30 30 Q 25 25 17 25 Z" fill="#C43831" />
    
    <!-- Flame/Light -->
    <path d="M 30 25 Q 26 20 30 10 Q 34 20 30 25" fill="url(#flameGrad)" />
    
    <!-- Sparks/Rays -->
    <circle cx="30" cy="5" r="1.5" fill="#E8C678" />
    <circle cx="21" cy="12" r="1" fill="#E8C678" />
    <circle cx="39" cy="12" r="1" fill="#E8C678" />
  </g>

  <!-- Text Area -->
  <g transform="translate(60, 38)">
    <text x="0" y="0" font-family="'Cairo', sans-serif" font-weight="700" font-size="28" fill="currentColor">
      سراج
    </text>
  </g>
</svg>
