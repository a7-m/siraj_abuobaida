<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نسيت كلمة المرور | سراج – مدرسة أبو عبيدة</title>

  <link rel="icon" type="image/svg+xml" href="./src/assets/images/favicon.svg">
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/global.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/components.css">

  <script>
    (function () {
      const savedTheme = localStorage.getItem('siraj-theme');
      if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else if (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  
  <style>
    .auth-container {
      max-width: 450px;
      margin: 4rem auto;
      padding: 2.5rem 2rem;
      border-radius: var(--border-radius-lg);
      background-color: var(--color-bg-secondary);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
    }
    .auth-title {
      text-align: center;
      margin-bottom: 0.5rem;
      color: var(--color-accent);
      font-size: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .form-control {
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius);
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: inherit;
      font-size: 1rem;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(11, 83, 69, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      font-size: 1.1rem;
      margin-top: 1rem;
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .auth-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }
    .auth-links a {
      color: var(--color-accent);
      font-weight: 600;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="index.html" class="logo"><img src="./src/assets/images/logo.svg" alt="شعار سراج"></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">الرئيسية</a>
      </nav>
      <div class="flex items-center gap-2">
        <button id="theme-toggle" class="btn-icon theme-toggle-btn" aria-label="تبديل الثيم"></button>
      </div>
    </div>
  </header>

  <main class="main-content container">
    <div class="auth-container">
      <div style="text-align: center; margin-bottom: 1rem; font-size: 3rem; color: var(--color-accent);">🔒</div>
      <h2 class="auth-title">استعادة كلمة المرور</h2>
      <p style="text-align: center; color: var(--color-text-muted); margin-bottom: 2rem; font-size: 0.9rem;">
        أدخل عنوان بريدك الإلكتروني وسنقوم بإرسال رابط الاستعادة إليك.
      </p>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" class="form-control" placeholder="student@example.com" required dir="ltr" style="text-align: right;">
        </div>
        
        <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
          إرسال رابط إعادة التعيين
        </button>

        <div class="auth-links">
          <a href="login.html">العودة إلى تسجيل الدخول</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer"><div class="container"><p>&copy; 2026 سراج – مدرسة أبو عبيدة. جميع الحقوق محفوظة.</p></div></footer>

  <script type="module">
    import { authService } from './src/services/auth.js';
    import './src/scripts/main.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري الإرسال...';

        try {
          await authService.sendPasswordResetEmail(email);
          window.Toast.success('تم إرسال الرابط. يرجى التحقق من بريدك الإلكتروني.');
          // Disable form to prevent spam
          submitBtn.textContent = 'تم الإرسال بنجاح!';
        } catch (error) {
          window.Toast.error('حدثت مشكلة أثناء محاولة الإرسال.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'إرسال رابط إعادة التعيين';
        }
      });
    });
  </script>
</body>
</html>
