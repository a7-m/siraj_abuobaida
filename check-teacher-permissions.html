<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فحص صلاحيات المعلم</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      direction: rtl;
    }
    .status {
      padding: 20px;
      margin: 10px 0;
      border-radius: 8px;
      border: 2px solid;
    }
    .success {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }
    .info {
      background: #d1ecf1;
      border-color: #17a2b8;
      color: #0c5460;
    }
    .warning {
      background: #fff3cd;
      border-color: #ffc107;
      color: #856404;
    }
    button {
      background: #127547;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #0d5a37;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      direction: ltr;
      text-align: left;
    }
    h2 {
      color: #127547;
      border-bottom: 2px solid #127547;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>🔍 فحص صلاحيات المعلم</h1>
  
  <div id="results"></div>

  <div style="margin-top: 30px;">
    <button onclick="checkPermissions()">فحص الصلاحيات</button>
    <button onclick="makeTeacher()" id="makeTeacherBtn" disabled>ترقية إلى معلم</button>
    <button onclick="testInsert()" id="testInsertBtn" disabled>اختبار إضافة سؤال</button>
  </div>

  <script type="module">
    import { supabase } from './src/services/supabase.js';
    import { authService } from './src/services/auth.js';

    let currentUser = null;
    let currentProfile = null;

    window.checkPermissions = async function() {
      const results = document.getElementById('results');
      results.innerHTML = '<div class="info">جاري الفحص...</div>';

      let html = '<h2>نتائج الفحص</h2>';

      try {
        // 1. Check session
        const { session, user } = await authService.getSessionAsync();
        currentUser = user;

        if (!session || !user) {
          html += `<div class="error">
            <strong>❌ لم يتم تسجيل الدخول</strong><br>
            يرجى تسجيل الدخول أولاً من <a href="login.html">صفحة تسجيل الدخول</a>
          </div>`;
          results.innerHTML = html;
          return;
        }

        html += `<div class="success">
          <strong>✅ تم تسجيل الدخول</strong><br>
          البريد الإلكتروني: ${user.email}<br>
          معرف المستخدم: ${user.id}
        </div>`;

        // 2. Check profile
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .single();

        if (profileError || !profile) {
          html += `<div class="error">
            <strong>❌ لا يوجد ملف تعريف</strong><br>
            الخطأ: ${profileError?.message || 'غير موجود'}<br>
            <strong>الحل:</strong> يجب إنشاء ملف تعريف في جدول profiles
          </div>`;
          results.innerHTML = html;
          return;
        }

        currentProfile = profile;

        html += `<div class="${profile.role === 'teacher' ? 'success' : 'warning'}">
          <strong>${profile.role === 'teacher' ? '✅' : '⚠️'} ملف التعريف</strong><br>
          الاسم: ${profile.full_name || 'غير محدد'}<br>
          الدور: <strong>${profile.role}</strong><br>
          الصف: ${profile.grade || 'غير محدد'}<br>
          القسم: ${profile.section || 'غير محدد'}
        </div>`;

        // 3. Test get_user_role function
        try {
          const { data: roleData, error: roleError } = await supabase.rpc('get_user_role');
          
          if (roleError) {
            html += `<div class="error">
              <strong>❌ خطأ في دالة get_user_role</strong><br>
              ${roleError.message}
            </div>`;
          } else {
            html += `<div class="${roleData === 'teacher' ? 'success' : 'warning'}">
              <strong>دالة get_user_role()</strong><br>
              القيمة المرجعة: <strong>${roleData || 'null'}</strong><br>
              ${roleData !== 'teacher' ? '<strong>⚠️ الدور ليس "teacher"</strong>' : '✅ الدور صحيح'}
            </div>`;
          }
        } catch (err) {
          html += `<div class="error">
            <strong>❌ خطأ في استدعاء get_user_role</strong><br>
            ${err.message}
          </div>`;
        }

        // 4. Test questions table permissions
        try {
          const { data: testQuestion, error: insertError } = await supabase
            .from('questions')
            .insert({
              type: 'mcq',
              text: 'سؤال اختبار - يمكن حذفه',
              points: 1,
              metadata: { options: ['أ', 'ب'], correct_answer: 'أ' }
            })
            .select()
            .single();

          if (insertError) {
            html += `<div class="error">
              <strong>❌ فشل إضافة سؤال تجريبي</strong><br>
              الخطأ: ${insertError.message}<br>
              الكود: ${insertError.code}<br>
              التفاصيل: ${insertError.details || 'لا يوجد'}<br>
              التلميح: ${insertError.hint || 'لا يوجد'}
              <pre>${JSON.stringify(insertError, null, 2)}</pre>
            </div>`;

            if (profile.role !== 'teacher') {
              document.getElementById('makeTeacherBtn').disabled = false;
            }
          } else {
            html += `<div class="success">
              <strong>✅ نجح إضافة سؤال تجريبي</strong><br>
              معرف السؤال: ${testQuestion.id}
            </div>`;

            // Delete test question
            await supabase.from('questions').delete().eq('id', testQuestion.id);
            html += `<div class="info">تم حذف السؤال التجريبي تلقائياً</div>`;
            
            document.getElementById('testInsertBtn').disabled = false;
          }
        } catch (err) {
          html += `<div class="error">
            <strong>❌ خطأ غير متوقع</strong><br>
            ${err.message}
            <pre>${JSON.stringify(err, null, 2)}</pre>
          </div>`;
        }

        // Summary
        if (profile.role === 'teacher') {
          html += `<div class="success">
            <h3>✅ الخلاصة: الصلاحيات صحيحة</h3>
            يمكنك الآن إنشاء الأسئلة بنجاح.
          </div>`;
        } else {
          html += `<div class="warning">
            <h3>⚠️ الخلاصة: الدور غير صحيح</h3>
            الدور الحالي: <strong>${profile.role}</strong><br>
            الدور المطلوب: <strong>teacher</strong><br><br>
            <strong>الحل:</strong> اضغط على زر "ترقية إلى معلم" أعلاه
          </div>`;
          document.getElementById('makeTeacherBtn').disabled = false;
        }

      } catch (err) {
        html += `<div class="error">
          <strong>❌ خطأ عام</strong><br>
          ${err.message}
          <pre>${JSON.stringify(err, null, 2)}</pre>
        </div>`;
      }

      results.innerHTML = html;
    };

    window.makeTeacher = async function() {
      if (!currentUser) {
        alert('يرجى فحص الصلاحيات أولاً');
        return;
      }

      const confirmed = confirm(`هل أنت متأكد من ترقية المستخدم:\n${currentUser.email}\nإلى معلم؟`);
      if (!confirmed) return;

      const btn = document.getElementById('makeTeacherBtn');
      btn.disabled = true;
      btn.textContent = 'جاري الترقية...';

      try {
        const { data, error } = await supabase
          .from('profiles')
          .update({ role: 'teacher' })
          .eq('id', currentUser.id);

        if (error) throw error;

        alert('✅ تمت الترقية بنجاح! يرجى إعادة الفحص.');
        window.checkPermissions();
      } catch (err) {
        alert('❌ فشلت الترقية: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'ترقية إلى معلم';
      }
    };

    window.testInsert = async function() {
      const btn = document.getElementById('testInsertBtn');
      btn.disabled = true;
      btn.textContent = 'جاري الاختبار...';

      try {
        const { data, error } = await supabase
          .from('questions')
          .insert({
            type: 'tf',
            text: 'هل هذا سؤال اختبار؟',
            points: 1,
            metadata: { options: ['صح', 'خطأ'], correct_answer: 'صح' }
          })
          .select()
          .single();

        if (error) throw error;

        alert(`✅ نجح! تم إنشاء السؤال برقم: ${data.id}`);
        
        // Clean up
        await supabase.from('questions').delete().eq('id', data.id);
        
      } catch (err) {
        alert('❌ فشل: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'اختبار إضافة سؤال';
      }
    };

    // Auto-check on load
    window.addEventListener('DOMContentLoaded', () => {
      window.checkPermissions();
    });
  </script>
</body>
</html>
