  <style>
    .auth-container {
      max-width: 600px; /* Wider for 2-column grid */
      margin: 4rem auto;

      left: 1rem;
      top: 50%;

      margin-right: 0.25rem;
    }

      text-decoration: underline;
    }

      height: 4px;
      width: 100%;
      background: var(--color-border);

  <main class="main-content container">
    <div class="auth-container">
      <h2 class="auth-title">إنشاء حساب كطالب</h2>
      <form id="signup-form">
        
        <div class="form-group">
          <label for="fullName">الاسم المعرّف (ثلاثي)</label>
          <input type="text" id="fullName" class="form-control" placeholder="مثال: أحمد بن سعيد البلوشي" required minlength="5">
        </div>

        <div class="form-group">
          <label for="email">البريد الإلكتروني للإشعارات</label>
          <input type="email" id="email" class="form-control" placeholder="student@example.com" required dir="ltr" style="text-align: right;">
        </div>

        <!-- School Type Selection -->
        <div class="form-group">
          <label>المدرسة المنتمي إليها <span style="color: var(--color-danger, #ef4444);">*</span></label>
          <div class="radio-pills" style="display: flex; gap: 0.75rem; margin-bottom: 0.5rem;">
            <div class="radio-pill" style="flex: 1; position: relative;">
              <input type="radio" name="signup_school_type" id="signup_school_abu_obaida" value="abu_obaida" checked style="position: absolute; opacity: 0; pointer-events: none;">
              <label for="signup_school_abu_obaida" id="label-school-ao" style="display: flex; align-items: center; justify-content: center; padding: 0.75rem 1rem; border: 2px solid var(--color-primary); border-radius: var(--border-radius); background: rgba(18, 117, 71, 0.08); color: var(--color-primary); cursor: pointer; font-weight: 600;">
                مدرسة أبو عبيدة
              </label>
            </div>
            <div class="radio-pill" style="flex: 1; position: relative;">
              <input type="radio" name="signup_school_type" id="signup_school_other" value="other" style="position: absolute; opacity: 0; pointer-events: none;">
              <label for="signup_school_other" id="label-school-other" style="display: flex; align-items: center; justify-content: center; padding: 0.75rem 1rem; border: 2px solid var(--color-border); border-radius: var(--border-radius); background: var(--color-bg); cursor: pointer; font-weight: 600;">
                مدرسة أخرى
              </label>
            </div>
          </div>
        </div>

        <!-- Abu Obaida Section (Default) -->
        <div id="signup-abu-obaida-section">
          <div class="grid grid-2">
            <div class="form-group">
              <label for="ao-grade">الصف الدراسي <span style="color: var(--color-danger, #ef4444);">*</span></label>
              <select id="ao-grade" class="form-control" required>
                <option value="" disabled selected>جاري تحميل الصفوف من المدرسة...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="ao-section">الشعبة الدراسية <span style="color: var(--color-danger, #ef4444);">*</span></label>
              <select id="ao-section" class="form-control" required disabled>
                <option value="" disabled selected>اختر الصف أولاً...</option>
              </select>
            </div>
          </div>
          <div class="form-hint" style="font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 1rem;">
            🏛️ الصفوف والشعب المتاحة يتم جلبها تلقائياً ومباشرة من قاعدة بيانات مدرسة أبو عبيدة.
          </div>
        </div>

        <!-- Other School Section (Conditional) -->
        <div id="signup-other-school-section" style="display: none;">
          <div class="form-group">
            <label for="other-school-name">اسم المدرسة <span style="color: var(--color-danger, #ef4444);">*</span></label>
            <input type="text" id="other-school-name" class="form-control" placeholder="أدخل اسم مدرستك كاملة..." minlength="2">
          </div>
          <div class="grid grid-2">
            <div class="form-group">
              <label for="other-grade">الصف الدراسي (1 - 12) <span style="color: var(--color-danger, #ef4444);">*</span></label>
              <select id="other-grade" class="form-control">
                <option value="" disabled selected>اختر الصف</option>
                <option value="الأول">الصف الأول</option>
                <option value="الثاني">الصف الثاني</option>
                <option value="الثالث">الصف الثالث</option>
                <option value="الرابع">الصف الرابع</option>
                <option value="الخامس">الصف الخامس</option>
                <option value="السادس">الصف السادس</option>
                <option value="السابع">الصف السابع</option>
                <option value="الثامن">الصف الثامن</option>
                <option value="التاسع">الصف التاسع</option>
                <option value="العاشر">الصف العاشر</option>
                <option value="الحادي عشر">الصف الحادي عشر</option>
                <option value="الثاني عشر">الصف الثاني عشر</option>
              </select>
            </div>
            <div class="form-group">
              <label for="other-section">رقم الشعبة <span style="color: var(--color-danger, #ef4444);">*</span></label>
              <input type="number" id="other-section" class="form-control" placeholder="مثال: 1" min="1" max="50" step="1">
            </div>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <div class="password-container">
              <input type="password" id="password" class="form-control" placeholder="••••••••" required dir="ltr" style="text-align: right; width: 100%;" minlength="6">
              <button type="button" class="password-toggle" id="toggle-pw" tabindex="-1">👁️</button>
            </div>
            <div class="strength-meter"><div class="strength-meter-fill" id="strength-fill"></div></div>
          </div>
          <div class="form-group">
            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <div class="password-container">
              <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required dir="ltr" style="text-align: right; width: 100%;" minlength="6">
              <button type="button" class="password-toggle" id="toggle-cpw" tabindex="-1">👁️</button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
          تسجيل حساب جديد
        </button>

        <div style="text-align: center; margin: 1.25rem 0 0.75rem; color: var(--color-text-muted); font-size: 0.85rem;">أو</div>

        <button id="google-signup-btn" type="button" class="btn btn-outline flex items-center justify-center gap-1" style="width: 100%; padding: 0.75rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/><path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 000 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0 7.565 0 3.515 2.7 1.545 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
          <span>التسجيل باستخدام Google</span>
        </button>

        <button id="guest-login-btn" type="button" class="btn btn-outline flex items-center justify-center gap-2" style="width: 100%; margin-top: 0.75rem; border: 1.5px dashed var(--color-primary); color: var(--color-primary); font-weight: 700; padding: 0.75rem 1rem; border-radius: var(--border-radius); background: rgba(79, 70, 229, 0.04); transition: all 0.2s ease;">
          <span style="font-size: 1.25rem;">🎓</span>
          <span>الدخول السريع كطالب (بدون حساب)</span>
        </button>

        <div class="auth-links">
          <span>لديك حساب بالفعل؟</span><a href="login.html">تسجيل الدخول هنا</a>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { authService } from './src/services/auth.js';
    import { supabase } from './src/services/supabase.js';
    import { studentIdentity } from './src/utils/student-identity.js';
    import { getSchoolClasses, formatGradeLabel, formatSectionLabel } from './src/services/school-classes.js';
    import './src/scripts/main.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // Redirect if logged in already (User Requirement 9: prevent arbitrary viewing)
      if (authService.isLoggedIn()) {
        window.location.replace('dashboard.html');
      }

      // Guest login handler
      const guestBtn = document.getElementById('guest-login-btn');
      if (guestBtn) {
        guestBtn.addEventListener('click', () => {
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get('redirect') || 'develop.html';
          studentIdentity.showGuestLoginModal({ redirectUrl });
        });
      }

      const pwdInput = document.getElementById('password');
      const cpwInput = document.getElementById('confirmPassword');
      const togglePwdBtn = document.getElementById('toggle-pw');
      const toggleCpwBtn = document.getElementById('toggle-cpw');
      const strengthFill = document.getElementById('strength-fill');
      const form = document.getElementById('signup-form');
      const submitBtn = document.getElementById('submit-btn');

      // School type elements
      const radioAo = document.getElementById('signup_school_abu_obaida');
      const radioOther = document.getElementById('signup_school_other');
      const labelAo = document.getElementById('label-school-ao');
      const labelOther = document.getElementById('label-school-other');
      const sectionAo = document.getElementById('signup-abu-obaida-section');
      const sectionOther = document.getElementById('signup-other-school-section');

      // Abu Obaida inputs
      const aoGradeSelect = document.getElementById('ao-grade');
      const aoSectionSelect = document.getElementById('ao-section');

      // Other school inputs
      const otherSchoolName = document.getElementById('other-school-name');
      const otherGradeSelect = document.getElementById('other-grade');
      const otherSectionInput = document.getElementById('other-section');

      let schoolClasses = null;

      // Populate Abu Obaida classes from DB
      async function populateAoClasses() {
        try {
          schoolClasses = await getSchoolClasses();
          const grades = schoolClasses.grades || [];

          if (grades.length === 0) {
            aoGradeSelect.innerHTML = '<option value="" disabled selected>لا توجد صفوف مسجلة</option>';
            return;
          }

          aoGradeSelect.innerHTML = '<option value="" disabled selected>اختر الصف</option>' +
            grades.map(g => `<option value="${g}">${formatGradeLabel(g)}</option>`).join('');

          // Auto-select first grade if available
          if (grades.length > 0) {
            aoGradeSelect.value = grades[0];
            updateAoSections(grades[0]);
          }
        } catch (e) {
          console.error('Error loading school classes:', e);
        }
      }

      function updateAoSections(grade) {
        if (!schoolClasses) return;
        const sections = schoolClasses.sectionsByGrade[grade] || [];
        
        if (sections.length === 0) {
          aoSectionSelect.innerHTML = '<option value="" disabled selected>لا توجد شعب مفعلة لهذا الصف</option>';
          aoSectionSelect.disabled = true;
          return;
        }

        aoSectionSelect.innerHTML = '<option value="" disabled selected>اختر الشعبة</option>' +
          sections.map(s => `<option value="${s}">${formatSectionLabel(s)}</option>`).join('');

        aoSectionSelect.disabled = false;
        // Pre-select first section
        if (sections.length > 0) {
          aoSectionSelect.value = sections[0];
        }
      }

      aoGradeSelect.addEventListener('change', () => {
        updateAoSections(aoGradeSelect.value);
      });

      // Toggle School Type
      function toggleSchool(isAbuObaida) {
        if (isAbuObaida) {
          radioAo.checked = true;
          labelAo.style.borderColor = 'var(--color-primary)';
          labelAo.style.background = 'rgba(18, 117, 71, 0.08)';
          labelAo.style.color = 'var(--color-primary)';

          labelOther.style.borderColor = 'var(--color-border)';
          labelOther.style.background = 'var(--color-bg)';
          labelOther.style.color = 'inherit';

          sectionAo.style.display = 'block';
          sectionOther.style.display = 'none';

          aoGradeSelect.required = true;
          aoSectionSelect.required = true;
          otherSchoolName.required = false;
          otherGradeSelect.required = false;
          otherSectionInput.required = false;
        } else {
          radioOther.checked = true;
          labelOther.style.borderColor = 'var(--color-primary)';
          labelOther.style.background = 'rgba(18, 117, 71, 0.08)';
          labelOther.style.color = 'var(--color-primary)';

          labelAo.style.borderColor = 'var(--color-border)';
          labelAo.style.background = 'var(--color-bg)';
          labelAo.style.color = 'inherit';

          sectionAo.style.display = 'none';
          sectionOther.style.display = 'block';

          aoGradeSelect.required = false;
          aoSectionSelect.required = false;
          otherSchoolName.required = true;
          otherGradeSelect.required = true;
          otherSectionInput.required = true;

          setTimeout(() => otherSchoolName.focus(), 80);
        }
      }

      radioAo.addEventListener('change', () => toggleSchool(true));
      radioOther.addEventListener('change', () => toggleSchool(false));

      // Initial load of classes
      await populateAoClasses();

      // Toggles password visibility
      const setupToggle = (btn, input) => {
        btn.addEventListener('click', () => {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
          input.setAttribute('type', type);
          btn.textContent = type === 'password' ? '👁️' : '🙈';
        });
      };
      setupToggle(togglePwdBtn, pwdInput);
      setupToggle(toggleCpwBtn, cpwInput);

      // Simple password strength calculator
      pwdInput.addEventListener('input', (e) => {
        const val = e.target.value;
        let score = 0;
        if (val.length > 5) score += 33;
        if (val.length >= 8) score += 33;
        if (/[A-Z]/.test(val) || /[0-9]/.test(val)) score += 34;
        
        strengthFill.style.width = score + '%';
        if (score < 40) strengthFill.style.backgroundColor = '#EF4444'; // Red
        else if (score < 80) strengthFill.style.backgroundColor = '#F59E0B'; // Orange
        else strengthFill.style.backgroundColor = '#10B981'; // Green
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const pwd = pwdInput.value;
        const cpw = cpwInput.value;

        if (pwd !== cpw) {
          window.Toast.error('كلمتا المرور غير متطابقتين.');
          return;
        }

        const isAo = radioAo.checked;
        let gradeVal = '';
        let sectionVal = '';
        let schoolType = 'abu_obaida';
        let schoolName = 'مدرسة أبو عبيدة';

        if (isAo) {
          gradeVal = aoGradeSelect.value;
          sectionVal = aoSectionSelect.value;

          if (!gradeVal || !sectionVal) {
            window.Toast.error('يرجى اختيار الصف والشعبة الدراسية لمدرسة أبو عبيدة.');
            return;
          }

          // Validation
          const validSections = schoolClasses?.sectionsByGrade?.[gradeVal] || [];
          if (validSections.length > 0 && !validSections.includes(String(sectionVal))) {
            window.Toast.error('الشعبة المختارة لا تنتمي للصف المحدد.');
            return;
          }
        } else {
          schoolType = 'other';
          schoolName = otherSchoolName.value.trim();
          gradeVal = otherGradeSelect.value;
          const sNum = parseInt(otherSectionInput.value, 10);

          if (!schoolName || schoolName.length < 2) {
            window.Toast.error('يرجى كتابة اسم مدرستك بشكل صحيح.');
            otherSchoolName.focus();
            return;
          }
          if (!gradeVal) {
            window.Toast.error('يرجى اختيار الصف الدراسي.');
            otherGradeSelect.focus();
            return;
          }
          if (isNaN(sNum) || sNum <= 0) {
            window.Toast.error('يرجى إدخال رقم شعبة صحيح (عدد موجب).');
            otherSectionInput.focus();
            return;
          }
          sectionVal = String(sNum);
        }

        const payload = {
          fullName: document.getElementById('fullName').value.trim(),
          grade: gradeVal,
          section: sectionVal,
          schoolType: schoolType,
          schoolName: schoolName
        };

        const email = document.getElementById('email').value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري الإنشاء...';

        try {
          const signUpRes = await authService.signup(email, pwd, payload);

          // Guarantee profile update in Supabase if session or user was returned
          if (signUpRes?.user && supabase) {
            try {
              await supabase.from('profiles').update({
                full_name: payload.fullName,
                grade: payload.grade,
                section: payload.section,
                school_type: payload.schoolType,
                school_name: payload.schoolName,
                last_verified_at: new Date().toISOString()
              }).eq('id', signUpRes.user.id);
            } catch (errSync) {
              console.warn('Could not sync profile post-signup:', errSync);
            }
          }

          window.Toast.success('تم إنشاء الحساب بنجاح! جاري الانطلاق...');
          setTimeout(() => { window.location.replace('dashboard.html'); }, 1500);
        } catch (error) {
          let msg = 'حدث خطأ أثناء الاتصال بالخادم.';
          if (error.message.includes('already registered')) msg = 'هذا البريد مستخدم مسبقاً.';
          else if (error.message.includes('Weak password')) msg = 'كلمة المرور ضعيفة جداً.';
          
          window.Toast.error(msg);
          submitBtn.disabled = false;
          submitBtn.textContent = 'تسجيل حساب جديد';
        }
      });

      // Google Sign-up handler
      const googleBtn = document.getElementById('google-signup-btn');
      if (googleBtn) {
        googleBtn.addEventListener('click', async () => {
          const originalContent = googleBtn.innerHTML;
          try {
            googleBtn.disabled = true;
            googleBtn.innerHTML = `
              <span style="display:inline-block; margin-left: 0.5rem;">⏳</span>
              <span>جاري التحويل إلى Google...</span>
            `;
            await authService.loginWithGoogle();
          } catch (error) {
            googleBtn.disabled = false;
            googleBtn.innerHTML = originalContent;
            if (error.message === 'FILE_PROTOCOL') {
              window.Toast.error('للتسجيل بجوجل، يرجى تشغيل الموقع عبر خادم محلي (مثل Live Server).');
            } else {
              window.Toast.error(error.message || 'تعذر الاتصال بخدمة Google.');
            }
          }
        });
      }
    });
  </script>
</body>
</html>
