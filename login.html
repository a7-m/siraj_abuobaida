<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تسجيل الدخول | سراج – مدرسة أبو عبيدة</title>
  <link rel="icon" type="image/svg+xml" href="./src/assets/images/favicon.svg">
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/global.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <link rel="stylesheet" href="./src/styles/dotgrid.css">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('siraj-theme');
      if (savedTheme === 'dark') {document.documentElement.setAttribute('data-theme', 'dark');}
      else if (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) {document.documentElement.setAttribute('data-theme', 'dark');}
    })();
  </script>
</head>
<body>

  <header class="header">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="index.html" class="logo"><img src="./src/assets/images/logo.svg" alt="شعار سراج"></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">نبذة</a>
        <a href="develop.html" class="nav-link">طوّر نفسك</a>
        <a href="competition.html" class="nav-link">مسابقة السراج</a>
        <a href="research.html" class="nav-link">البحث العلمي</a>
        <a href="identity.html" class="nav-link">الهوية الوطنية</a>
      </nav>
      <div class="flex items-center gap-2">
        <button id="theme-toggle" class="btn-icon theme-toggle-btn"></button>
        <button id="hamburger-btn" class="hamburger">&#9776;</button>
      </div>
    </div>
  </header>

  <div id="mobile-menu" class="mobile-menu-overlay">
    <div class="flex justify-between items-center" style="margin-bottom: 2rem;">
      <a href="index.html" class="logo"><img src="./src/assets/images/logo.svg" style="height:35px;"></a>
      <button onclick="document.getElementById('mobile-menu').classList.remove('active')" class="btn-icon" style="font-size: 2rem; margin-top: -10px;">&times;</button>
    </div>
    <a href="index.html" class="mobile-nav-link">نبذة</a>
    <a href="develop.html" class="mobile-nav-link">طوّر نفسك</a>
    <a href="competition.html" class="mobile-nav-link">مسابقة السراج</a>
    <a href="research.html" class="mobile-nav-link">البحث العلمي</a>
    <a href="identity.html" class="mobile-nav-link">الهوية الوطنية</a>
  </div>

  <main class="main-content container flex items-center justify-center dotgrid">

    <div class="card" style="width: 100%; max-width: 450px; padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="./src/assets/images/logo.svg" alt="سراج" style="height: 50px; margin: 0 auto 1rem;">
        <h2 style="color: var(--color-text);">تسجيل الدخول</h2>
        <p style="color: var(--color-text-muted); font-size: 0.9rem;">مرحباً بك مجدداً في منصة سراج</p>
      </div>

      <form id="login-form" onsubmit="event.preventDefault(); window.mockLogin();">
        <div class="flex flex-col gap-1" style="margin-bottom: 1rem;">
          <label style="font-weight: 600; font-size: 0.9rem;">البريد الإلكتروني</label>
          <input type="email" required placeholder="name@example.com" style="padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--border-radius); background: var(--color-bg); color: var(--color-text); font-family: inherit;">
        </div>

        <div class="flex flex-col gap-1" style="margin-bottom: 0.5rem;">
          <label style="font-weight: 600; font-size: 0.9rem;">كلمة المرور</label>
          <input type="password" required placeholder="••••••••" style="padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--border-radius); background: var(--color-bg); color: var(--color-text); font-family: inherit;">
        </div>

        <div style="text-align: left; margin-bottom: 1.5rem;">
          <a href="#" style="font-size: 0.85rem; color: var(--color-accent);">نسيت كلمة المرور؟</a>
        </div>

        <button id="login-btn" type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">دخول</button>
      </form>

      <div style="text-align: center; margin-bottom: 1rem; color: var(--color-text-muted); font-size: 0.85rem;">أو</div>

      <button class="btn btn-outline flex items-center justify-center gap-1" style="width: 100%; margin-bottom: 1.5rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/><path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 000 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0 7.565 0 3.515 2.7 1.545 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
        الدخول باستخدام Google
      </button>

      <div style="text-align: center; font-size: 0.9rem;">
        <span style="color: var(--color-text-muted);">ليس لديك حساب؟</span>
        <a href="#" style="color: var(--color-accent); font-weight: 600;">إنشاء حساب جديد</a>
      </div>
    </div>

  </main>

  <footer class="footer"><div class="container"><p>&copy; 2026 سراج – مدرسة أبو عبيدة. جميع الحقوق محفوظة.</p></div></footer>
  <script type="module">
    import { authService } from './src/services/auth.js';
    import './src/scripts/main.js';
    
    // Auto-redirect if already logged in (prevent showing login page unnecessarily)
    authService.getSessionAsync().then(({ session }) => {
      if (session) {
        window.location.replace('dashboard.html');
      }
    });

    window.mockLogin = async () => {
      const emailInput = document.querySelector('input[type="email"]');
      const passInput = document.querySelector('input[type="password"]');
      const btn = document.getElementById('login-btn');
      
      const email = emailInput.value;
      const pass = passInput.value;

      btn.innerText = 'جاري تسجيل الدخول...';
      btn.disabled = true;
      
      try {
        await authService.login(email, pass);
        window.Toast.success('تم تسجيل الدخول بنجاح! جاري التوجيه...');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (error) {
        btn.innerText = 'دخول';
        btn.disabled = false;
        
        let errorMsg = 'حدث خطأ غير متوقع. يرجى المحاولة لاحقاً.';
        if (error.message.includes('missing')) {
          errorMsg = 'المفاتيح غير موجودة. لم يتم تفعيل قاعدة البيانات بعد.';
        } else if (error.message.includes('Invalid login credentials')) {
          errorMsg = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
        }
        window.Toast.error(errorMsg);
      }
    };
  </script>
</body>
</html>
