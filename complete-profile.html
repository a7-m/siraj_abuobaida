<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إكمال البيانات | سراج – مدرسة أبو عبيدة</title>

  <link rel="icon" type="image/svg+xml" href="./src/assets/images/favicon.svg">
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/global.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/components.css">

  <script>
    (function () {
      const savedTheme = localStorage.getItem('siraj-theme');
      if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else if (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  
  <style>
    .auth-container {
      max-width: 450px;
      margin: 4rem auto;
      padding: 2.5rem 2rem;
      border-radius: var(--border-radius-lg);
      background-color: var(--color-bg-secondary);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
    }
    .auth-title {
      text-align: center;
      margin-bottom: 0.5rem;
      color: var(--color-accent);
      font-size: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .form-control {
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius);
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: inherit;
      font-size: 1rem;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(11, 83, 69, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      font-size: 1.1rem;
      margin-top: 1rem;
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="index.html" class="logo"><img src="./src/assets/images/logo.svg" alt="شعار سراج"></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">الرئيسية</a>
      </nav>
      <div class="flex items-center gap-2">
        <button id="theme-toggle" class="btn-icon theme-toggle-btn" aria-label="تبديل الثيم"></button>
      </div>
    </div>
  </header>

  <main class="main-content container">
    <div class="auth-container">
      <div style="text-align: center; margin-bottom: 1rem; font-size: 3rem;">👋</div>
      <h2 class="auth-title">لقد اقتربنا!</h2>
      <p style="text-align: center; color: var(--color-text-muted); margin-bottom: 2rem;">
        أهلاً بك في منصة سراج. يرجى استكمال بياناتك الأكاديمية للمتابعة.
      </p>

      <form id="complete-form">
        <div class="form-group">
          <label for="grade">الصف الدراسي</label>
          <select id="grade" class="form-control" required>
            <option value="" disabled selected>اختر الصف</option>
            <option value="الخامس">الخامس</option>
            <option value="السادس">السادس</option>
            <option value="السابع">السابع</option>
            <option value="الثامن">الثامن</option>
            <option value="التاسع">التاسع</option>
            <option value="العاشر">العاشر</option>
            <option value="الحادي عشر">الحادي عشر</option>
            <option value="الثاني عشر">الثاني عشر</option>
          </select>
        </div>
        <div class="form-group">
          <label for="section">الشعبة</label>
          <select id="section" class="form-control" required>
            <option value="" disabled selected>اختر الشعبة</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
          حفظ والمتابعة
        </button>
      </form>
    </div>
  </main>

  <footer class="footer"><div class="container"><p>&copy; 2026 سراج – مدرسة أبو عبيدة. جميع الحقوق محفوظة.</p></div></footer>

  <script type="module">
    import { authService } from './src/services/auth.js';
    import { supabase } from './src/services/supabase.js';
    import './src/scripts/main.js';

    let currentUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // Must be authenticated to see this page
      const { session } = await authService.getSessionAsync();
      if (!session) {
        window.location.replace('login.html');
        return;
      }
      currentUserId = session.user.id;

      const form = document.getElementById('complete-form');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const grade = document.getElementById('grade').value;
        const section = document.getElementById('section').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري الحفظ...';

        try {
          // Update the existing profile record strictly using RLS
          const { error } = await supabase
            .from('profiles')
            .update({ grade, section })
            .eq('id', currentUserId);

          if (error) throw error;

          window.Toast.success('تم استكمال البيانات بنجاح!');
          setTimeout(() => { window.location.replace('dashboard.html'); }, 1000);
          
        } catch (error) {
          console.error(error);
          window.Toast.error('حدث خطأ أثناء حفظ البيانات.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'حفظ والمتابعة';
        }
      });
    });
  </script>
</body>
</html>
